<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Política de segurança: só carrega código do próprio site e do CanvasKit
       (gstatic) e só conversa com o Supabase e as APIs de cotação. Bloqueia
       scripts injetados e envio de dados para outros domínios.
       connect-src precisa de blob:: o ditado lê a gravação (URL blob:) via
       HTTP antes de enviar à IA. -->

  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob:;
    font-src 'self' data: https://fonts.gstatic.com;
    media-src 'self' blob:;
    worker-src 'self' blob:;
    frame-src 'self' blob:;
    connect-src 'self' blob: https://tkfhthotspehsgvmpsjm.supabase.co wss://tkfhthotspehsgvmpsjm.supabase.co https://www.gstatic.com https://fonts.gstatic.com;
    object-src 'none';
    base-uri 'self';
    form-action 'none';
  ">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Meu Bolso">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Meu Bolso</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Antes do app: desvia retornos do link de confirmação de e-mail. -->
  <script src="retorno-email.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
