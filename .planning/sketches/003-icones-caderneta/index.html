<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Bolso · Ícones</title>
<link rel="stylesheet" href="../themes/default.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding-top: 58px; background: #e9dfc4; color: #1d2a47; font-family: Inter, system-ui, sans-serif; }
  #variant-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 9998; background: #fbf6ea; border-bottom: 1px solid rgba(29,42,71,.15); padding: 10px 16px; display: flex; gap: 8px; overflow-x: auto; align-items: center; }
  .variant-tab, .tog { border: 1px solid rgba(29,42,71,.25); background: #fff; color: #1d2a47; border-radius: 999px; padding: 7px 14px; font: 600 13px Inter; cursor: pointer; white-space: nowrap; transition: all .15s ease; }
  .variant-tab:hover, .tog:hover { border-color: #1d2a47; }
  .variant-tab.active, .tog.on { background: #1d2a47; color: #f4ecd8; border-color: #1d2a47; }
  .sep { width: 1px; height: 24px; background: rgba(29,42,71,.2); margin: 0 6px; flex: none; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
  .ficha { background: #fbf6ea; border: 1px solid rgba(29,42,71,.18); border-radius: 16px; padding: 16px 20px; margin-bottom: 20px; box-shadow: 0 6px 18px rgba(29,42,71,.08); }
  .ficha h1 { font: 600 24px Fraunces, serif; margin: 0 0 4px; }
  .ficha p { margin: 0; font-size: 14px; color: #6f6a5c; }
  .ficha .amostra { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; }
  .ficha .amostra span { font-size: 26px; color: #1d2a47; }
  .phones { display: flex; gap: 28px; justify-content: center; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .col .rot { font: 700 11px Inter; letter-spacing: .1em; text-transform: uppercase; color: #6f6a5c; }
  .phone { width: 360px; max-width: calc(100vw - 32px); height: 760px; border-radius: 44px; padding: 10px; background: #111; box-shadow: 0 30px 60px -20px rgba(0,0,0,.35); }

  /* ---------- tela no estilo Caderneta suave ---------- */
  .tela { position: relative; height: 100%; border-radius: 34px; overflow: hidden; display: flex; flex-direction: column; background: var(--papel); color: var(--tinta); font-family: Inter, sans-serif;
    --papel: #f4ecd8; --claro: #fbf6ea; --chip: #ebe1c7; --tinta: #1d2a47; --apagado: #6f6a5c; --margem: #b3261e; --receita: #2d6a3e; --contorno: rgba(29,42,71,.22); --sombra: rgba(29,42,71,.14); --pauta: #e3d6b6; }
  .tela.escuro { --papel: #17213a; --claro: #1c2844; --chip: #243154; --tinta: #f1e8d2; --apagado: #a9a18c; --margem: #ef7a70; --receita: #7fbf8e; --contorno: rgba(241,232,210,.2); --sombra: rgba(0,0,0,.4); --pauta: #243154; }
  .sb { height: 28px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; font: 600 12px Inter; }
  .scroll { flex: 1; overflow-y: auto; padding: 0 14px 90px; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  .appbar { display: flex; align-items: center; gap: 8px; padding: 6px 14px 4px; }
  .appbar .nome { font: italic 600 20px Fraunces, serif; flex: 1; }
  .logo { width: 26px; height: 26px; }
  .abas { display: flex; margin: 4px 14px 12px; }
  .aba { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; border-radius: 999px; font: 600 12.5px Inter; color: var(--apagado); cursor: pointer; transition: all .15s ease; }
  .aba.on { background: var(--chip); color: var(--tinta); }
  .card { background: var(--claro); border: 1px solid var(--contorno); border-radius: 16px; box-shadow: 0 6px 18px var(--sombra); padding: 14px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 10px; font: 600 15px Fraunces, serif; display: flex; align-items: center; gap: 8px; }
  .saldo { position: relative; overflow: hidden; background: repeating-linear-gradient(var(--claro) 0 27px, var(--pauta) 27px 28px); }
  .saldo::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; border-left: 1.5px solid var(--margem); border-right: 1.5px solid var(--margem); }
  .saldo .rot { font-size: 12px; font-weight: 600; }
  .saldo .v { font: 600 30px 'IBM Plex Mono', monospace; color: var(--receita); margin: 4px 0 8px; }
  .saldo .linha { display: flex; gap: 14px; font-size: 11px; color: var(--apagado); }
  .saldo .linha div { display: flex; align-items: center; gap: 6px; }
  .saldo .linha b { display: block; font: 600 13px 'IBM Plex Mono'; }
  .saldo .linha .in b { color: var(--receita); } .saldo .linha .out b { color: var(--margem); }
  .item { display: flex; align-items: center; gap: 12px; padding: 9px 2px; border-bottom: 1px solid var(--contorno); cursor: pointer; transition: background .15s ease; border-radius: 10px; }
  .item:last-child { border-bottom: 0; }
  .item:hover { background: var(--chip); }
  .item .t { flex: 1; font-size: 13.5px; font-weight: 500; }
  .item .t small { display: block; color: var(--apagado); font-size: 11.5px; font-weight: 400; }
  .item .val { font: 600 12.5px 'IBM Plex Mono'; }
  .item .dt { color: var(--margem); font: 600 11.5px 'IBM Plex Mono'; }
  .cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 6px; }
  .cat { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; color: var(--apagado); cursor: pointer; }
  .fabs { position: absolute; right: 16px; bottom: 22px; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
  .fab { border: 0; background: var(--tinta); color: var(--papel); border-radius: 999px; height: 50px; min-width: 50px; padding: 0 16px; display: flex; align-items: center; gap: 8px; font: 600 14px Inter; cursor: pointer; box-shadow: 0 8px 18px var(--sombra); transition: transform .15s ease; }
  .fab:hover { transform: translateY(-2px); }
  .fab.sq { width: 50px; padding: 0; justify-content: center; }

  /* ícone base: tamanho e cor */
  .ic { font-size: 22px; line-height: 1; display: inline-flex; color: inherit; }
  .ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 22px; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; font-variation-settings: 'FILL' 0, 'wght' 450, 'GRAD' 0, 'opsz' 24; }
  .ms.fill { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }
  .ph-duotone::before { opacity: 1; }
  .tela .ph-duotone { --ph-duotone-opacity: .28; }

  /* selo: ícone dentro de um círculo de papel com anel de tinta */
  .selo .ic.s { width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--chip); box-shadow: inset 0 0 0 1px var(--contorno); font-size: 19px; }
  .selo .ic.s.ms { font-size: 19px; }
  .selo .cat .ic.s { width: 46px; height: 46px; font-size: 22px; }
  .selo .item .ic.s.venc { box-shadow: inset 0 0 0 1.5px var(--margem); color: var(--margem); background: transparent; }

  .toast { position: absolute; left: 50%; bottom: 100px; transform: translate(-50%, 20px); opacity: 0; background: var(--tinta); color: var(--papel); padding: 9px 14px; border-radius: 999px; font: 600 12px Inter; white-space: nowrap; transition: all .25s ease; pointer-events: none; z-index: 5; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="variant-nav">
  <button class="variant-tab" data-v="duo">A · Traço duplo (Phosphor Duotone) ★ Escolhido</button>
  <button class="variant-tab" data-v="bold">B · Traço firme (Phosphor Bold)</button>
  <button class="variant-tab" data-v="ms">C · Arredondado (Material Rounded)</button>
  <span class="sep"></span>
  <button class="tog" data-selo="1">Ícones em selo</button>
</div>

<div class="wrap">
  <section class="ficha" id="ficha"></section>
  <div class="phones">
    <div class="col"><span class="rot">Claro</span><div class="phone"><div class="tela" id="t-claro"></div></div></div>
    <div class="col"><span class="rot">Escuro</span><div class="phone"><div class="tela escuro" id="t-escuro"></div></div></div>
  </div>
</div>

<div id="sketch-tools" style="position:fixed;bottom:12px;right:12px;z-index:9999;font:12px system-ui;background:rgba(0,0,0,.75);color:#fff;padding:8px 12px;border-radius:8px;opacity:.45;transition:opacity .2s" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=.45">Sketch 003 · troque as abas e o selo</div>

<script>
/* Mesmo conceito, três famílias. Chave = papel do ícone no app. */
const NOMES = {
  resumo:      { ph: 'chart-donut',      ms: 'donut_large' },
  livro:       { ph: 'notebook',         ms: 'menu_book' },
  menu:        { ph: 'dots-three-vertical', ms: 'more_vert' },
  sobe:        { ph: 'trend-up',         ms: 'trending_up' },
  desce:       { ph: 'trend-down',       ms: 'trending_down' },
  venc:        { ph: 'calendar-dots',    ms: 'event' },
  cartao:      { ph: 'credit-card',      ms: 'credit_card' },
  meta:        { ph: 'target',           ms: 'track_changes' },
  relatorio:   { ph: 'chart-bar',        ms: 'bar_chart' },
  banco:       { ph: 'bank',             ms: 'account_balance' },
  seguranca:   { ph: 'lock-simple',      ms: 'lock' },
  tema:        { ph: 'palette',          ms: 'palette' },
  sair:        { ph: 'sign-out',         ms: 'logout' },
  mic:         { ph: 'microphone',       ms: 'mic' },
  mais:        { ph: 'plus',             ms: 'add' },
  alimentacao: { ph: 'fork-knife',       ms: 'restaurant' },
  transporte:  { ph: 'car-profile',      ms: 'directions_car' },
  moradia:     { ph: 'house-line',       ms: 'home' },
  saude:       { ph: 'first-aid-kit',    ms: 'medical_services' },
  lazer:       { ph: 'film-slate',       ms: 'movie' },
  mercado:     { ph: 'basket',           ms: 'shopping_basket' },
  assinaturas: { ph: 'repeat',           ms: 'autorenew' },
  outros:      { ph: 'dots-three-circle', ms: 'more_horiz' },
  pix:         { ph: 'lightning',        ms: 'bolt' },
};

const V = {
  duo:  { t: 'A · Traço duplo', d: 'Phosphor Duotone: contorno de tinta com um preenchimento suave por dentro, como marca-texto em caderno. É o mais "desenhado" e acolhedor.' },
  bold: { t: 'B · Traço firme', d: 'Phosphor Bold: um único traço mais grosso e arredondado, como caneta de ponta porosa. Mais legível em tamanho pequeno.' },
  ms:   { t: 'C · Arredondado', d: 'Material Symbols Rounded: a família atual, mas com cantos arredondados e o ícone da aba ativa preenchido. Não precisa de biblioteca nova.' },
};

let v = 'duo', selo = false;
try { const s = JSON.parse(localStorage.getItem('sketch003') || '{}'); v = s.v || v; selo = !!s.selo; } catch (_) {}

function ic(chave, { s = false, ativo = false, extra = '' } = {}) {
  const n = NOMES[chave];
  const cls = `ic ${s && selo ? 's' : ''} ${extra}`;
  if (v === 'ms') return `<span class="${cls} ms ${ativo ? 'fill' : ''}">${n.ms}</span>`;
  const peso = v === 'duo' ? (ativo ? 'ph-fill' : 'ph-duotone') : 'ph-bold';
  return `<span class="${cls}"><i class="${v === 'duo' && ativo ? 'ph-duotone' : peso} ph-${n.ph}"></i></span>`;
}

const logo = `<svg class="logo" viewBox="0 0 100 100"><g transform="rotate(-8 50 50)"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--margem)" stroke-width="7"/><circle cx="50" cy="50" r="31" fill="none" stroke="var(--margem)" stroke-width="2" stroke-dasharray="4 5"/><text x="50" y="62" text-anchor="middle" font-family="Fraunces" font-weight="800" font-size="34" fill="var(--tinta)">MB</text></g></svg>`;

function tela() {
  const menu = [['cartao', 'Cartões'], ['meta', 'Metas'], ['relatorio', 'Relatórios'], ['banco', 'Open Finance'], ['seguranca', 'Segurança'], ['tema', 'Tema'], ['sair', 'Sair']];
  const cats = [['alimentacao', 'Alimentação'], ['transporte', 'Transporte'], ['moradia', 'Moradia'], ['saude', 'Saúde'], ['lazer', 'Lazer'], ['mercado', 'Mercado'], ['assinaturas', 'Assinaturas'], ['outros', 'Outros']];
  return `<div class="sb"><span>16:46</span><span>●●● ▮</span></div>
  <div class="appbar">${logo}<span class="nome">Meu Bolso</span><span data-toast="Menu">${ic('menu')}</span></div>
  <div class="abas"><div class="aba on" data-aba>${ic('resumo', { ativo: true })}Resumo</div><div class="aba" data-aba>${ic('livro')}Livro-caixa</div></div>
  <div class="scroll">
    <div class="card saldo"><div class="rot" style="padding-left:6px">Saldo do mês</div><div class="v" style="padding-left:6px">R$ 3.880,00</div>
      <div class="linha" style="padding-left:6px"><div class="in">${ic('sobe', { s: true })}<span>Receitas<b>8.000,00</b></span></div><div class="out">${ic('desce', { s: true })}<span>Despesas<b>4.120,00</b></span></div></div></div>
    <div class="card"><h3>${ic('venc')}Próximos vencimentos</h3>
      <div class="item" data-toast="Conta de luz">${ic('venc', { s: true, extra: 'venc' })}<div class="t">Conta de luz<small>Vence amanhã · Pix</small></div><span class="val">187,40</span></div>
      <div class="item" data-toast="Fatura Nubank">${ic('cartao', { s: true, extra: 'venc' })}<div class="t">Fatura Nubank<small>Vence em 5 dias</small></div><span class="val">1.284,90</span></div>
      <div class="item" data-toast="Internet">${ic('assinaturas', { s: true, extra: 'venc' })}<div class="t">Internet<small>Vence em 12 dias</small></div><span class="val">99,90</span></div></div>
    <div class="card"><h3>Categorias</h3><div class="cats">${cats.map(([k, n]) => `<div class="cat" data-toast="${n}">${ic(k, { s: true })}<span>${n}</span></div>`).join('')}</div></div>
    <div class="card"><h3>Menu</h3>${menu.map(([k, n]) => `<div class="item" data-toast="${n}">${ic(k, { s: true })}<div class="t">${n}</div><span style="color:var(--apagado)">›</span></div>`).join('')}</div>
  </div>
  <div class="fabs"><button class="fab" data-toast="Ditar lançamento">${ic('mic')}Ditar</button><button class="fab sq" data-toast="Novo lançamento">${ic('mais')}</button></div>
  <div class="toast"></div>`;
}

function render() {
  document.body.classList.toggle('selo', selo);
  document.querySelectorAll('.tela').forEach(t => t.innerHTML = tela());
  const amostra = ['resumo', 'livro', 'mic', 'venc', 'cartao', 'meta', 'relatorio', 'banco', 'alimentacao', 'transporte', 'moradia', 'mercado'].map(k => ic(k)).join('');
  document.getElementById('ficha').innerHTML = `<h1>${V[v].t}${selo ? ' + selo' : ''}</h1><p>${V[v].d}${selo ? ' Com o selo, cada ícone fica num círculo de papel, como o carimbo do app; os vencimentos ganham anel vermelho.' : ''}</p><div class="amostra">${amostra}</div>`;
  document.querySelectorAll('.variant-tab').forEach(b => b.classList.toggle('active', b.dataset.v === v));
  document.querySelector('[data-selo]').classList.toggle('on', selo);
  try { localStorage.setItem('sketch003', JSON.stringify({ v, selo })); } catch (_) {}
}

document.addEventListener('click', e => {
  const b = e.target.closest('.variant-tab'); if (b) { v = b.dataset.v; return render(); }
  if (e.target.closest('[data-selo]')) { selo = !selo; return render(); }
  const a = e.target.closest('[data-aba]');
  if (a) { const t = a.closest('.tela'); t.querySelectorAll('[data-aba]').forEach(x => x.classList.toggle('on', x === a)); return; }
  const t = e.target.closest('[data-toast]');
  if (t) { const el = t.closest('.tela').querySelector('.toast'); el.textContent = t.dataset.toast; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1400); }
});
render();
</script>
</body>
</html>
